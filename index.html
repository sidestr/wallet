<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sidestr wallet</title>
<meta name="description" content="A wallet for a sidestr chain: keys in your browser, the chain read and checked from a mirror, transactions sent to a relay. Nothing else.">
<style>
:root { color-scheme: dark; --bg:#070b0a; --panel:rgba(255,255,255,.028); --panel2:rgba(255,255,255,.05); --line:rgba(148,196,184,.12); --line2:rgba(148,196,184,.22); --text:#e7f0ed; --mut:#8fa8a1; --dim:#5c716c; --ac:#2dd4bf; --warn:#f5b84f; --bad:#f87171; --good:#4ade80; }
* { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
code, .mono { font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; font-size:.92em }
header { display:flex; flex-wrap:wrap; gap:.6rem 1rem; align-items:center; padding:1rem 1.2rem; border-bottom:1px solid var(--line) }
header h1 { margin:0; font-size:1.15rem; font-weight:600 } header h1 span { color:var(--ac) }
.pill { border:1px solid var(--line2); border-radius:999px; padding:.15rem .7rem; color:var(--mut); font-size:.85rem } .pill b { color:var(--text); font-weight:500 }
main { max-width:900px; margin:0 auto; padding:1.2rem; display:grid; gap:1rem }
section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:1rem 1.1rem }
h2 { margin:0 0 .6rem; font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); font-weight:600 }
.big { font-size:1.9rem; font-weight:600; letter-spacing:-.01em } .big small { font-size:.9rem; color:var(--mut); font-weight:400; margin-left:.4rem }
.row { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center } .grow { flex:1 1 220px }
input, select { background:var(--panel2); color:var(--text); border:1px solid var(--line2); border-radius:8px; padding:.5rem .65rem; font:inherit; width:100% } input.mono { font-family:ui-monospace, Menlo, monospace; font-size:.88rem }
button { background:var(--panel2); color:var(--text); border:1px solid var(--line2); border-radius:8px; padding:.5rem .9rem; font:inherit; cursor:pointer } button.ac { background:var(--ac); color:#04211d; border-color:transparent; font-weight:600 } button.danger { color:var(--bad) } button:disabled { opacity:.5; cursor:default }
.addr { word-break:break-all; padding:.5rem .65rem; background:var(--panel2); border-radius:8px; border:1px solid var(--line) }
.muted { color:var(--mut) } .dim { color:var(--dim) } .warn { color:var(--warn) } .bad { color:var(--bad) } .good { color:var(--good) }
table { width:100%; border-collapse:collapse; font-size:.92rem } td, th { text-align:left; padding:.4rem .3rem; border-top:1px solid var(--line) } th { color:var(--mut); font-weight:500; border-top:0 } td.r, th.r { text-align:right }
.note { background:rgba(245,184,79,.08); border:1px solid rgba(245,184,79,.3); border-radius:8px; padding:.6rem .8rem; font-size:.92rem }
.err { background:rgba(248,113,113,.08); border:1px solid rgba(248,113,113,.3); border-radius:8px; padding:.6rem .8rem }
a { color:var(--ac); text-decoration:none } a:hover { text-decoration:underline }
details summary { cursor:pointer; color:var(--mut) } .hidden { display:none !important }
footer { color:var(--dim); font-size:.85rem; text-align:center; padding:1rem }
</style>
</head>
<body>
<header><h1><span>sidestr</span> wallet</h1><span class="pill" id="chainpill">…</span><span class="pill" id="tippill"></span><span class="grow"></span><button id="refresh">refresh</button></header>
<main id="app"><section><h2>starting</h2><div id="boot" class="muted">…</div></section></main>
<footer>keys stay in this browser, unencrypted · the chain is read and validated from a mirror · transactions go to a relay · <a href="https://github.com/sidestr/spec" target="_blank" rel="noopener">spec</a></footer>
<script type="module">
const q = new URLSearchParams(location.search);
const LS = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: (k) => { try { localStorage.removeItem(k); } catch {} } };
const mirror = (q.get('mirror') ?? LS.get('sidestr_mirror') ?? '').replace(/\/+$/, '');
const overrides = Object.fromEntries(['lib', 'cdn', 'explorer'].filter((k) => q.get(k)).map((k) => [k, q.get(k)]));
const EXPLORER_UI = q.get('explorer-ui') ?? 'https://sidestr.com/explorer/';
const $ = (id) => document.getElementById(id), esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sats = (n) => n.toLocaleString('en-US'), coins = (n) => (n / 1e8).toLocaleString('en-US', { maximumFractionDigits: 8 });
const app = $('app'); let w = null, key = null, me = null, relays = [];
const explore = (kind, id) => `${EXPLORER_UI}?mirror=${encodeURIComponent(mirror)}#/${kind}/${id}`;

if (!mirror) {
  app.innerHTML = `<section><h2>which chain?</h2><p>This wallet needs a <b>mirror</b>: a URL that serves a sidestr chain's <code>chain.json</code>, <code>blocks.json</code> and <code>blocks.dat</code>. The same one the explorer uses.</p>
  <div class="row"><input id="mirrorin" class="grow mono" placeholder="https://…/siding" value=""><button class="ac" id="mirrorgo">open</button></div></section>`;
  $('mirrorgo').onclick = () => { const v = $('mirrorin').value.trim().replace(/\/+$/, ''); if (v) { LS.set('sidestr_mirror', v); location.search = '?mirror=' + encodeURIComponent(v); } };
} else boot();

async function boot() {
  try {
    const { openWallet, DEFAULTS } = await import('./wallet.mjs');
    relays = (LS.get('sidestr_relays') ?? DEFAULTS.relays.join(',')).split(',').map((x) => x.trim()).filter(Boolean);
    w = await openWallet({ mirror, ...overrides, onProgress: (s) => { $('boot').textContent = s + '…'; } });
    LS.set('sidestr_mirror', mirror);
    key = LS.get(`sidestr_key:${w.chain.id}`); render();
  } catch (e) { app.innerHTML = `<section><div class="err"><b>could not open the chain</b><br>${esc(e.message)}<br><span class="dim">mirror: ${esc(mirror)}</span></div></section>`; console.error(e); }
}

function render() {
  $('chainpill').innerHTML = `chain <b>${esc(w.chain.name)}</b>`; $('tippill').innerHTML = `height <b>${w.tip?.height ?? 0}</b>`;
  if (!key) return (app.innerHTML = `<section><h2>your key</h2><p>No key in this browser for <b>${esc(w.chain.name)}</b>. Make one, or paste one you saved.</p>
    <div class="row"><button class="ac" id="mk">make a new key</button></div>
    <div class="row" style="margin-top:.6rem"><input id="imp" class="grow mono" placeholder="64 hex characters"><button id="impgo">use this key</button></div>
    <p class="muted" style="margin-bottom:0">The key is stored unencrypted in this browser's storage, like the BLAKE wallet does. Small amounts. Back it up below once it exists.</p></section>`, setKeyHandlers());
  me = w.identity(key); const bal = w.balance(me.script), cs = w.coins(me.script), hist = w.history(me.script).slice(0, 30);
  app.innerHTML = `
<section><h2>balance</h2><div class="big">${coins(bal.spendable)}<small>coins spendable</small></div>
  ${bal.immature ? `<div class="muted">+ ${coins(bal.immature)} immature (coinbase, ${w.ex.k.params.coinbaseMaturity} confirmations)</div>` : ''}
  <div class="dim" style="margin-top:.3rem">${cs.length} coin${cs.length === 1 ? '' : 's'} · <a href="${explore('address', me.address)}" target="_blank" rel="noopener">this address on the explorer ↗</a></div></section>
<section><h2>receive</h2><div class="addr mono" id="addr">${esc(me.address)}</div>
  <div class="row" style="margin-top:.5rem"><button id="copy">copy address</button><span class="dim">script <code>${esc(me.script.slice(0, 12))}…</code></span></div></section>
<section><h2>send</h2>
  <div class="row"><input id="to" class="grow mono" placeholder="${esc(w.hrp)}1… address (or a script hex)"></div>
  <div class="row" style="margin-top:.5rem"><input id="amount" class="grow mono" placeholder="amount in sats" inputmode="numeric"><input id="fee" class="mono" style="width:9rem" value="1000" inputmode="numeric" title="fee in sats"><button class="ac" id="send">sign &amp; publish</button></div>
  <div id="sendout" style="margin-top:.6rem"></div></section>
<section><h2>coins</h2>${cs.length ? `<table><tr><th>value</th><th>height</th><th></th></tr>${cs.map((c) => `<tr><td class="mono">${sats(c.value)}</td><td>${c.height}</td><td class="dim">${c.coinbase ? (c.mature ? 'coinbase, mature' : `coinbase, matures at ${c.maturesAt}`) : ''} <a href="${explore('tx', c.txid)}" target="_blank" rel="noopener">${esc(c.txid.slice(0, 10))}… ↗</a></td></tr>`).join('')}</table>` : '<div class="dim">nothing yet</div>'}</section>
<section><h2>history</h2>${hist.length ? `<table><tr><th></th><th class="r">sats</th><th>block</th><th>tx</th></tr>${hist.map((h) => `<tr><td class="${h.dir === 'in' ? 'good' : 'muted'}">${h.dir}</td><td class="r mono">${h.dir === 'in' ? '+' : '−'}${sats(h.value)}</td><td>${h.height}</td><td><a href="${explore('tx', h.txid)}" target="_blank" rel="noopener" class="mono">${esc(h.txid.slice(0, 10))}…</a></td></tr>`).join('')}</table>` : '<div class="dim">nothing yet</div>'}</section>
<section><h2>settings</h2>
  <div class="row"><span class="muted" style="width:5rem">mirror</span><input id="mirrorset" class="grow mono" value="${esc(mirror)}"></div>
  <div class="row" style="margin-top:.4rem"><span class="muted" style="width:5rem">relays</span><input id="relayset" class="grow mono" value="${esc(relays.join(', '))}"></div>
  <div class="row" style="margin-top:.6rem"><button id="save">save</button></div>
  <details style="margin-top:.8rem"><summary>private key backup</summary><div class="addr mono" style="margin-top:.4rem">${esc(key)}</div><p class="muted">Anyone with this can spend your coins. It is not encrypted.</p></details>
  <details style="margin-top:.4rem"><summary class="bad">danger zone</summary><p class="muted">Forget the key in this browser. Without a backup the coins are gone.</p><button class="danger" id="forget1">forget this key</button> <button class="danger hidden" id="forget2">yes, forget it</button></details></section>`;
  setKeyHandlers(); $('copy').onclick = async () => { try { await navigator.clipboard.writeText(me.address); $('copy').textContent = 'copied'; setTimeout(() => $('copy').textContent = 'copy address', 1500); } catch {} };
  $('send').onclick = send;
  $('save').onclick = () => { const m = $('mirrorset').value.trim().replace(/\/+$/, ''); LS.set('sidestr_relays', $('relayset').value); if (m && m !== mirror) { LS.set('sidestr_mirror', m); location.search = '?mirror=' + encodeURIComponent(m); } else { relays = $('relayset').value.split(',').map((x) => x.trim()).filter(Boolean); $('save').textContent = 'saved'; setTimeout(() => $('save').textContent = 'save', 1500); } };
  $('forget1').onclick = () => { $('forget2').classList.remove('hidden'); }; $('forget2').onclick = () => { LS.del(`sidestr_key:${w.chain.id}`); key = null; me = null; render(); };
}
function setKeyHandlers() {
  const mk = $('mk'), impgo = $('impgo');
  if (mk) mk.onclick = () => { key = w.newKey(); LS.set(`sidestr_key:${w.chain.id}`, key); render(); };
  if (impgo) impgo.onclick = () => { const v = $('imp').value.trim().toLowerCase(); try { w.identity(v); key = v; LS.set(`sidestr_key:${w.chain.id}`, key); render(); } catch (e) { $('imp').value = ''; $('imp').placeholder = e.message; } };
  return '';
}
async function send() {
  const out = $('sendout'), btn = $('send'); out.innerHTML = '';
  let b; try { b = w.build({ key, to: $('to').value, amount: Number($('amount').value), fee: Number($('fee').value) }); if (!w.verify(b, key)) throw new Error('the signature did not verify; nothing was sent'); }
  catch (e) { return out.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  btn.disabled = true;
  out.innerHTML = `${b.note ? `<div class="note">${esc(b.note)}</div>` : ''}<div class="muted" style="margin-top:.4rem">signed <code>${esc(b.txid.slice(0, 16))}…</code>: ${sats(b.amount)} sats + fee ${sats(b.fee)}, ${b.inputs.length} input${b.inputs.length === 1 ? '' : 's'}, change ${sats(b.change)}. publishing…</div>`;
  try {
    const r = await w.publish(b.hex, relays);
    const rl = Object.entries(r.results).map(([u, s]) => `<span class="${s === 'ok' ? 'good' : 'dim'}">${esc(u.replace('wss://', ''))}: ${esc(s)}</span>`).join(' · ');
    if (!r.accepted) { btn.disabled = false; return out.innerHTML += `<div class="err">no relay accepted the event: ${rl}</div>`; }
    out.innerHTML += `<div>event <code>${esc(r.event.slice(0, 16))}…</code> → ${rl}</div><div id="wait" class="muted">waiting for the mirror to show it…</div>`;
    for (let i = 0; i < 18; i++) { await new Promise((res) => setTimeout(res, 10000)); const m = await w.mined(b.txid); if (m) { $('wait').innerHTML = `<span class="good">mined in block ${m.height}</span> · <a href="${explore('tx', b.txid)}" target="_blank" rel="noopener">on the explorer ↗</a>`; btn.disabled = false; return render(); } $('wait').textContent = `waiting for the mirror to show it… ${(i + 1) * 10} s`; }
    $('wait').innerHTML = `<span class="warn">not on the mirror after 3 minutes</span> — the producer may be slow, or the mirror behind; refresh later.`;
  } catch (e) { out.innerHTML += `<div class="err">${esc(e.message)}</div>`; }
  btn.disabled = false;
}
$('refresh').onclick = async () => { if (!w) return; $('refresh').disabled = true; try { await w.refresh(); render(); } finally { $('refresh').disabled = false; } };
</script>
</body>
</html>
