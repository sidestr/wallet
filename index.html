<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sidestr wallet</title>
<meta name="description" content="A wallet for a sidestr chain: keys in your browser, the chain read and checked from a mirror, transactions sent to a relay. Nothing else.">
<style>
:root { color-scheme: dark; --bg:#070b0a; --panel:rgba(255,255,255,.028); --panel2:rgba(255,255,255,.05); --line:rgba(148,196,184,.12); --line2:rgba(148,196,184,.22); --text:#e7f0ed; --mut:#8fa8a1; --dim:#5c716c; --ac:#2dd4bf; --warn:#f5b84f; --bad:#f87171; --good:#4ade80; }
* { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
code, .mono { font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; font-size:.92em }
header { display:flex; flex-wrap:wrap; gap:.6rem 1rem; align-items:center; padding:1rem 1.2rem; border-bottom:1px solid var(--line) }
header h1 { margin:0; font-size:1.15rem; font-weight:600 } header h1 span { color:var(--ac) }
.pill { border:1px solid var(--line2); border-radius:999px; padding:.15rem .7rem; color:var(--mut); font-size:.85rem } .pill b { color:var(--text); font-weight:500 }
main { max-width:900px; margin:0 auto; padding:1.2rem; display:grid; gap:1rem }
section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:1rem 1.1rem }
h2 { margin:0 0 .6rem; font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); font-weight:600 }
h3 { margin:.9rem 0 .35rem; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); font-weight:600 }
.big { font-size:1.9rem; font-weight:600; letter-spacing:-.01em } .big small { font-size:.9rem; color:var(--mut); font-weight:400; margin-left:.4rem }
.row { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center } .grow { flex:1 1 220px }
input, select, textarea { background:var(--panel2); color:var(--text); border:1px solid var(--line2); border-radius:8px; padding:.5rem .65rem; font:inherit; width:100% } input.mono { font-family:ui-monospace, Menlo, monospace; font-size:.88rem }
button { background:var(--panel2); color:var(--text); border:1px solid var(--line2); border-radius:8px; padding:.5rem .9rem; font:inherit; cursor:pointer } button.ac { background:var(--ac); color:#04211d; border-color:transparent; font-weight:600 } button.danger { color:var(--bad) } button:disabled { opacity:.5; cursor:default }
.addr { word-break:break-all; padding:.5rem .65rem; background:var(--panel2); border-radius:8px; border:1px solid var(--line) }
.muted { color:var(--mut) } .dim { color:var(--dim) } .warn { color:var(--warn) } .bad { color:var(--bad) } .good { color:var(--good) }
table { width:100%; border-collapse:collapse; font-size:.92rem } td, th { text-align:left; padding:.4rem .3rem; border-top:1px solid var(--line) } th { color:var(--mut); font-weight:500; border-top:0 } td.r, th.r { text-align:right }
.note { background:rgba(245,184,79,.08); border:1px solid rgba(245,184,79,.3); border-radius:8px; padding:.6rem .8rem; font-size:.92rem }
.err { background:rgba(248,113,113,.08); border:1px solid rgba(248,113,113,.3); border-radius:8px; padding:.6rem .8rem }
a { color:var(--ac); text-decoration:none } a:hover { text-decoration:underline }
details summary { cursor:pointer; color:var(--mut) } .hidden { display:none !important }
footer { color:var(--dim); font-size:.85rem; text-align:center; padding:1rem }
.tag{display:inline-block;font-size:.72rem;padding:.05rem .4rem;border-radius:.3rem;background:rgba(45,212,191,.12);color:var(--ac);font-family:var(--mono)}.tag.warn{background:rgba(251,191,36,.14);color:#fbbf24}
</style>
</head>
<body>
<header><h1><span>sidestr</span> wallet</h1><span class="pill" id="chainpill">…</span><span class="pill" id="tippill"></span><span class="grow"></span><button id="refresh">refresh</button></header>
<main id="app"><section><h2>starting</h2><div id="boot" class="muted">…</div></section></main>
<footer>keys stay in this browser, unencrypted · the chain is read and validated from a mirror · transactions go to a relay · <a href="https://github.com/sidestr/spec" target="_blank" rel="noopener">spec</a></footer>
<script type="module">
const q = new URLSearchParams(location.search);
const LS = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: (k) => { try { localStorage.removeItem(k); } catch {} } };
// a chain id alone is enough: the wallet finds a mirror from the signer's announcement on the relays
const chainId = (q.get('chain') ?? (q.get('mirror') ? '' : LS.get('sidestr_chain')) ?? '').trim();
let mirror = (q.get('mirror') ?? (chainId ? '' : LS.get('sidestr_mirror')) ?? '').replace(/\/+$/, '');
const overrides = Object.fromEntries(['lib', 'cdn', 'explorer'].filter((k) => q.get(k)).map((k) => [k, q.get(k)]));
const EXPLORER_UI = q.get('explorer-ui') ?? 'https://sidestr.com/explorer/';
const $ = (id) => document.getElementById(id), esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sats = (n) => n.toLocaleString('en-US');
const app = $('app'); let w = null, key = null, me = null, relays = [], verdict = null, busy = false, pegoutsPaid = {};
const burnOf = (txid) => { for (const [k, v] of Object.entries(pegoutsPaid)) if (k.startsWith(txid + ':')) return v; return w?.ex.txs.get(txid)?.tx.outputs.some((o) => /^6a/.test(o.scriptPubKey) && o.value > 0) ? { parentTxid: null } : null; };
const explore = (kind, id) => `${EXPLORER_UI}?${chainId ? 'chain=' + encodeURIComponent(chainId) : 'mirror=' + encodeURIComponent(mirror)}#/${kind}/${id}`;

if (!mirror && !chainId) {
  app.innerHTML = `<section><h2>which chain?</h2><p>Give this wallet a <b>chain id</b>: it asks the relays for the signer's tip announcement, which names the mirrors.</p>
  <div class="row"><input id="chainin" class="grow mono" placeholder="sidestr:name" value=""><button class="ac" id="chaingo">find</button></div>
  <p style="margin-top:.8rem">Or a <b>mirror</b>: a URL that serves the chain's <code>chain.json</code>, <code>blocks.json</code> and <code>blocks.dat</code>. The same one the explorer uses.</p>
  <div class="row"><input id="mirrorin" class="grow mono" placeholder="https://…/siding" value=""><button class="ac" id="mirrorgo">open</button></div></section>`;
  $('mirrorgo').onclick = () => { const v = $('mirrorin').value.trim().replace(/\/+$/, ''); if (v) { LS.set('sidestr_mirror', v); LS.del('sidestr_chain'); location.search = '?mirror=' + encodeURIComponent(v); } };
  $('chaingo').onclick = () => { const v = $('chainin').value.trim(); if (v) { LS.set('sidestr_chain', v); location.search = '?chain=' + encodeURIComponent(v); } };
} else boot();

async function boot() {
  try {
    const { openWallet, DEFAULTS } = await import('./wallet.mjs');
    relays = (LS.get('sidestr_relays') ?? DEFAULTS.relays.join(',')).split(',').map((x) => x.trim()).filter(Boolean);
    w = await openWallet({ mirror: mirror || undefined, chain: chainId || undefined, relays, ...overrides, onProgress: (s) => { $('boot').textContent = s + '…'; } });
    mirror = w.mirror; if (chainId) { LS.set('sidestr_chain', chainId); LS.del('sidestr_mirror'); } else LS.set('sidestr_mirror', mirror);
    key = LS.get(`sidestr_key:${w.chain.id}`); await reloadPegouts(); render();
    w.judgeMirror().then((v) => { verdict = v; if (!busy) render(); }).catch(() => {});
    // a new block is announced the second it is made; the mirror follows within seconds
    w.followTips(async (t) => { for (let i = 0; i < 6 && (w.tip?.height ?? -1) < t.tip; i++) { await new Promise((r) => setTimeout(r, 2500)); await w.refresh(); } verdict = await w.judgeMirror().catch(() => verdict); await reloadPegouts(); if (!busy) render(); });
  } catch (e) { app.innerHTML = `<section><div class="err"><b>could not open the chain</b><br>${esc(e.message)}<br><span class="dim">${chainId ? 'chain: ' + esc(chainId) + ' · relays: ' + esc(relays.join(', ')) : 'mirror: ' + esc(mirror)}</span></div></section>`; console.error(e); }
}

async function reloadPegouts() { if (!w) return; pegoutsPaid = await w.pegoutsPaid(); }
function render() {
  $('chainpill').innerHTML = `chain <b>${esc(w.chain.name)}</b>`; $('tippill').innerHTML = `height <b>${w.tip?.height ?? 0}</b>${verdict ? ` <span class="${verdict.ok === false ? 'bad' : verdict.ok ? 'good' : 'dim'}" title="${esc(verdict.note)}">${verdict.ok === false ? '⚠' : verdict.ok ? '✓' : '·'}</span>` : ''}`;
  if (!key) return (app.innerHTML = `<section><h2>your key</h2><p>No key in this browser for <b>${esc(w.chain.name)}</b>. Make one, or paste one you saved.</p>
    <div class="row"><button class="ac" id="mk">make a new key</button></div>
    <div class="row" style="margin-top:.6rem"><input id="imp" class="grow mono" placeholder="64 hex characters"><button id="impgo">use this key</button></div>
    <p class="muted" style="margin-bottom:0">The key is stored unencrypted in this browser's storage, like the BLAKE wallet does. Small amounts. Back it up below once it exists.</p></section>`, setKeyHandlers());
  me = w.identity(key); const bal = w.balance(me.script), cs = w.coins(me.script), hist = w.history(me.script).slice(0, 30);
  app.innerHTML = `
<section><h2>balance</h2><div class="big">${sats(bal.spendable)}<small>sats spendable</small></div>
  ${bal.immature ? `<div class="muted">+ ${sats(bal.immature)} sats immature (coinbase, ${w.ex.k.params.coinbaseMaturity} confirmations)</div>` : ''}
  <div class="dim" style="margin-top:.3rem">${cs.length} coin${cs.length === 1 ? '' : 's'} · <a href="${explore('address', me.address)}" target="_blank" rel="noopener">this address on the explorer ↗</a></div>
  ${bal.total === 0 ? `<div class="row" style="margin-top:.7rem"><button class="ac" id="faucet">get test coins</button><span class="muted" id="faucetout">asks a faucet on the relay; coins arrive in a few seconds if one is listening</span></div>` : ''}</section>
<section><h2>receive</h2><div class="addr mono" id="addr">${esc(me.address)}</div>
  <div class="row" style="margin-top:.5rem"><button id="copy">copy address</button>${w.parentExplorer() ? ` <a class="dim" href="${esc(w.parentAddressUrl(w.address.scriptToAddress(me.script, /mainnet/.test(w.chain.parent) ? 'bc' : 'tb')))}" target="_blank" rel="noopener" title="the same key on the parent chain">this key on ${esc(w.chain.parent)} ↗</a>` : ''}<span class="dim">script <code>${esc(me.script.slice(0, 12))}…</code></span></div></section>
<section><h2>send</h2>
  <div class="row"><input id="to" class="grow mono" placeholder="${esc(w.hrp)}1… address (or a script hex)"></div>
  <div class="row" style="margin-top:.5rem"><input id="amount" class="grow mono" placeholder="amount in sats" inputmode="numeric"><input id="fee" class="mono" style="width:9rem" placeholder="fee: auto" inputmode="numeric" title="fee in sats; empty = the chain minimum for this size"><button class="ac" id="send">sign &amp; publish</button></div>
  <label class="muted" style="display:block;margin-top:.5rem"><input type="checkbox" id="pegout"> peg out: the address is on <b>${esc(w.chain.parent)}</b>; the sats burn here and the peg holders pay them there (at least ${sats(w.pegoutMin)})</label>
  <div id="sendout" style="margin-top:.6rem"></div></section>
<section><h2>coins</h2>${cs.length ? `<table><tr><th>value</th><th>height</th><th></th></tr>${cs.map((c) => `<tr><td class="mono">${sats(c.value)}</td><td>${c.height}</td><td>${c.coinbase ? (c.mature ? '<span class="tag" title="a coinbase past its maturity">mature</span>' : `<span class="tag warn" title="a coinbase output: spendable from block ${c.maturesAt}, ${c.maturesAt - (w.tip?.height ?? 0)} block(s) from now">immature · block ${c.maturesAt}</span>`) : ''} <a class="dim" href="${explore('tx', c.txid)}" target="_blank" rel="noopener">${esc(c.txid.slice(0, 10))}… ↗</a></td></tr>`).join('')}</table>` : '<div class="dim">nothing yet</div>'}</section>
${w.evm ? `<section id="evm"><h2>evm <small class="muted" style="font-weight:400">· this chain runs Ethereum contracts; 1 sat = 1 gwei</small></h2>
  <div class="row"><span class="muted" style="width:9rem">your address</span><span class="mono" id="ethaddr" style="word-break:break-all">${esc(w.ethAddress(key) ?? '')}</span><button id="ethcopy">copy</button></div>
  <div class="row" style="margin-top:.3rem"><span class="muted" style="width:9rem">EVM balance</span><span class="mono" id="ethbal">…</span></div>
  <p class="muted">The same key is your Ethereum account (paste it into MetaMask and this is the address). Everything below is signed here and checked against this page's own copy of the EVM state before it is published; the Ethereum transaction rides inside a sidestr transaction paid from your sats.</p>
  <h3>deposit</h3><div class="row"><input id="depamt" class="grow mono" placeholder="sats to deposit (= gwei)" inputmode="numeric"><button class="ac" id="deposit">deposit into the EVM</button></div><div id="depout"></div>
  <h3>send</h3><div class="row"><input id="evto" class="grow mono" placeholder="to: 0x… address"><input id="evamt" class="mono" style="width:11rem" placeholder="gwei (= sats)" inputmode="numeric"><button class="ac" id="evsend">send</button></div>
  <div class="row" style="margin-top:.3rem"><input id="evdata" class="grow mono" placeholder="data (hex), only for a contract call — leave empty for a plain transfer"><button id="evread" title="run the call here against the page's state without sending anything">read</button></div><div id="evout"></div>
  <h3>withdraw</h3><div class="row"><input id="wdamt" class="grow mono" placeholder="gwei to withdraw as sats to ${esc(me.address.slice(0, 12))}…" inputmode="numeric"><button class="ac" id="wdgo">withdraw to my address</button></div><div id="wdout"></div>
  <h3>tokens <small class="muted" style="font-weight:400">· ERC-20</small></h3><div class="row"><input id="tokaddr" class="grow mono" placeholder="token contract: 0x…" value="${esc(LS.get('sidestr_token:' + w.chain.id) ?? '')}"><button id="toklook">look up</button></div><div id="tokinfo" class="muted"></div>
  <div class="row" id="tokrow" style="margin-top:.3rem"><input id="tokto" class="grow mono" placeholder="to: 0x… address"><input id="tokamt" class="mono" style="width:11rem" placeholder="amount"><button class="ac" id="toksend" disabled>send tokens</button></div><div id="tokout"></div>
  <h3>deploy</h3><div class="row"><textarea id="evcode" class="grow mono" rows="3" placeholder="a contract's init code (hex): the compiler's bytecode plus ABI-encoded constructor arguments"></textarea><button class="ac" id="evdeploy">deploy</button></div><div id="deployout"></div>
  <h3>activity</h3><div id="evact" class="muted">…</div></section>` : ''}
${w.desk ? `<section id="desk"><h2>locked rewards <small class="muted" style="font-weight:400">· your immature coinbase outputs on ${esc(w.chain.parent)} — the desk pays ${(w.desk.rate * 100).toFixed(0)}% now for a reward locked until ${w.desk.maturity.toLocaleString('en-US')}</small></h2><div id="rewards" class="muted">reading the desk…</div>
  <details style="margin-top:.6rem"><summary class="muted">pledge a reward signed elsewhere</summary><p class="muted">From a node wallet: <code>createrawtransaction</code> spending the reward to <code>${esc(w.desk.pegAddress)}</code> minus ${w.desk.fee} sats, with a data output <code>pegin:${esc(w.chain.id)}:&lt;your script&gt;</code> and locktime ${w.desk.maturity}, sequence 4294967294; <code>signrawtransactionwithwallet</code>; paste the hex.</p>
  <div class="row"><input id="phex" class="grow mono" placeholder="signed transaction hex"><input id="pout" class="mono" style="width:14rem" placeholder="txid:vout"><button id="ppaste">publish</button></div><div id="pout2"></div></details></section>` : ''}
<section><h2>history</h2>${hist.length ? `<table><tr><th></th><th class="r">sats</th><th>block</th><th>tx</th><th>on ${esc(w.chain.parent)}</th></tr>${hist.map((h) => { const paid = burnOf(h.txid); const coin = h.dir === 'in' ? cs.find((c) => c.txid === h.txid && c.vout === h.vout) : null; return `<tr><td class="${h.dir === 'in' ? 'good' : 'muted'}">${h.dir}${coin?.coinbase && !coin.mature ? ` <span class="tag warn" title="spendable from block ${coin.maturesAt}">immature</span>` : ''}</td><td class="r mono">${h.dir === 'in' ? '+' : '−'}${sats(h.value)}</td><td>${h.height}</td><td><a href="${explore('tx', h.txid)}" target="_blank" rel="noopener" class="mono">${esc(h.txid.slice(0, 10))}…</a></td><td>${paid ? (paid.parentTxid ? `<a href="${esc(w.parentTxUrl(paid.parentTxid) ?? '#')}" target="_blank" rel="noopener" class="mono" title="${esc(paid.address)}">peg-out paid · ${esc(paid.parentTxid.slice(0, 10))}… ↗</a>` : '<span class="dim">peg-out · not yet paid</span>') : ''}</td></tr>`; }).join('')}</table>` : '<div class="dim">nothing yet</div>'}</section>
<section><h2>settings</h2>
  ${chainId ? `<div class="row"><span class="muted" style="width:5rem">chain</span><span class="mono">${esc(chainId)}</span></div>` : ''}
  <div class="row"><span class="muted" style="width:5rem">mirror</span><input id="mirrorset" class="grow mono" value="${esc(mirror)}"${chainId ? ' title="found from the signer\'s announcement; edit to pin one instead"' : ''}></div>
  ${verdict ? `<div class="row"><span class="muted" style="width:5rem"></span><span class="${verdict.ok === false ? 'bad' : 'dim'}">${esc(verdict.note)}</span></div>` : ''}
  <div class="row" style="margin-top:.4rem"><span class="muted" style="width:5rem">relays</span><input id="relayset" class="grow mono" value="${esc(relays.join(', '))}"></div>
  <div class="row" style="margin-top:.6rem"><button id="save">save</button></div>
  <details style="margin-top:.8rem"><summary>private key backup</summary><div class="addr mono" style="margin-top:.4rem">${esc(key)}</div><p class="muted">Anyone with this can spend your coins. It is not encrypted.</p></details>
  <details style="margin-top:.4rem"><summary class="bad">danger zone</summary><p class="muted">Forget the key in this browser. Without a backup the coins are gone.</p><button class="danger" id="forget1">forget this key</button> <button class="danger hidden" id="forget2">yes, forget it</button></details></section>`;
  setKeyHandlers(); $('copy').onclick = async () => { try { await navigator.clipboard.writeText(me.address); $('copy').textContent = 'copied'; setTimeout(() => $('copy').textContent = 'copy address', 1500); } catch {} };
  $('send').onclick = send; if (w.desk) renderRewards();
  if (w.evm) { const addr = w.ethAddress(key); w.evmBalance(addr).then((b) => { const el = $('ethbal'); if (el) el.textContent = `${sats(Number(b / 1000000000n))} gwei (= sats)`; });
    $('ethcopy').onclick = async () => { try { await navigator.clipboard.writeText(addr); $('ethcopy').textContent = 'copied'; setTimeout(() => $('ethcopy').textContent = 'copy', 1500); } catch {} };
    $('deposit').onclick = () => actSend({ key, to: addr, amount: Number($('depamt').value), evmDeposit: true }, 'depout', 'deposit');
    $('evsend').onclick = () => actEvm(() => w.buildEvm({ key, to: $('evto').value.trim(), value: BigInt($('evamt').value.trim() || 0), data: $('evdata').value.trim() || '0x' }), 'evout');
    $('evread').onclick = async () => { const o = $('evout'); try { const r = await w.evmCall({ from: addr, to: $('evto').value.trim(), value: BigInt($('evamt').value.trim() || 0), data: $('evdata').value.trim() || '0x' }); o.innerHTML = r.ok ? `<div>returns <code>${esc(r.returnValue)}</code>${/^0x[0-9a-f]{64}$/.test(r.returnValue) ? ` = ${BigInt(r.returnValue).toLocaleString('en-US')}` : ''} · ${r.gasUsed.toLocaleString('en-US')} gas</div>` : `<div class="err">reverts: ${esc(r.error)}</div>`; } catch (e) { o.innerHTML = `<div class="err">${esc(e.message)}</div>`; } };
    $('wdgo').onclick = () => actEvm(() => w.buildWithdraw({ key, sats: Number($('wdamt').value) }), 'wdout');
    $('evdeploy').onclick = () => actEvm(() => w.buildEvm({ key, data: $('evcode').value.trim() }), 'deployout');
    let tok = null; const lookup = async () => { const a = $('tokaddr').value.trim(); const o = $('tokinfo'); if (!a) return; o.textContent = 'reading the token from this page\'s state…'; try { tok = await w.token(a, addr); LS.set('sidestr_token:' + w.chain.id, a); o.innerHTML = `<b>${esc(tok.symbol ?? '?')}</b> ${tok.name ? esc(tok.name) + ' · ' : ''}${tok.decimals} decimals · you hold <b class="mono">${esc(tok.format(tok.balance))} ${esc(tok.symbol ?? '')}</b>${tok.supply != null ? ` of ${esc(tok.format(tok.supply))}` : ''}`; $('toksend').disabled = false; } catch (e) { tok = null; $('toksend').disabled = true; o.innerHTML = `<span class="err">${esc(e.message)}</span>`; } };
    $('toklook').onclick = lookup; if ($('tokaddr').value) lookup();
    $('toksend').onclick = () => actEvm(() => w.buildTokenTransfer({ key, contract: $('tokaddr').value.trim(), to: $('tokto').value.trim(), amount: $('tokamt').value }), 'tokout');
    renderActivity(addr); }
  if ($('faucet')) $('faucet').onclick = async () => { const b = $('faucet'), o = $('faucetout'); b.disabled = true; o.textContent = 'asking…';
    try { const r = await w.requestFaucet(me.address, relays); if (!r.accepted) { o.textContent = 'no relay accepted the request'; b.disabled = false; return; } o.textContent = 'asked; waiting for the coins…';
      for (let i = 0; i < 12; i++) { await new Promise((res) => setTimeout(res, 5000)); await w.refresh(); if (w.balance(me.script).total > 0) return render(); o.textContent = `asked; waiting for the coins… ${(i + 1) * 5} s`; }
      o.textContent = 'nothing arrived in a minute: no faucet listening, or its limits; refresh later'; b.disabled = false; } catch (e) { o.textContent = e.message; b.disabled = false; } };
  $('save').onclick = () => { const m = $('mirrorset').value.trim().replace(/\/+$/, ''); LS.set('sidestr_relays', $('relayset').value); if (m && m !== mirror) { LS.set('sidestr_mirror', m); location.search = '?mirror=' + encodeURIComponent(m); } else { relays = $('relayset').value.split(',').map((x) => x.trim()).filter(Boolean); $('save').textContent = 'saved'; setTimeout(() => $('save').textContent = 'save', 1500); } };
  $('forget1').onclick = () => { $('forget2').classList.remove('hidden'); }; $('forget2').onclick = () => { LS.del(`sidestr_key:${w.chain.id}`); key = null; me = null; render(); };
}
function setKeyHandlers() {
  const mk = $('mk'), impgo = $('impgo');
  if (mk) mk.onclick = () => { key = w.newKey(); LS.set(`sidestr_key:${w.chain.id}`, key); render(); };
  if (impgo) impgo.onclick = () => { const v = $('imp').value.trim().toLowerCase(); try { w.identity(v); key = v; LS.set(`sidestr_key:${w.chain.id}`, key); render(); } catch (e) { $('imp').value = ''; $('imp').placeholder = e.message; } };
  return '';
}
async function renderRewards() {
  const el = $('rewards'); if (!el) return;
  try {
    const list = await w.lockedRewards(me.script);
    if (!list.length) return (el.innerHTML = `<span class="muted">No locked reward at ${esc(me.address)} that the desk has seen (it lists taproot coinbase outputs from block ${w.desk.lockedFrom.toLocaleString('en-US')} on). Mine to this key's <code>${esc(w.address.scriptToAddress(me.script, 'tb'))}</code> and it will appear here.</span>`);
    el.innerHTML = `<table><tr><th>reward</th><th class="r">sats</th><th>block</th><th></th><th class="r">pays now</th><th></th></tr>${list.map((r, i) => `<tr><td class="mono"><a href="https://mempool.guide/testnet4/tx/${esc(r.txid)}" target="_blank" rel="noopener" title="the reward on the parent">${esc(r.txid.slice(0, 12))}…:${r.vout}</a></td><td class="r mono">${sats(r.value)}</td><td class="mono">${r.height}</td><td>${r.pledged ? `<span class="tag" title="pledged to the desk; the desk collects it at block ${r.maturity}">pledged · opens ${r.maturity}</span>` : `<span class="tag warn" title="a coinbase output on ${esc(w.chain.parent)}: spendable there from block ${r.maturity}">immature · until ${r.maturity}</span>`}</td><td class="r mono">${r.pledged ? `<span class="good">paid ${sats(r.pledged.paid)}</span>` : sats(r.pays)}</td><td>${r.pledged ? `<span class="dim">pledged</span>` : `<button class="ac" data-pledge="${i}">pledge</button>`}</td></tr>`).join('')}</table><div id="pmsg"></div>`;
    el.querySelectorAll('[data-pledge]').forEach((b) => b.onclick = async () => { const r = list[Number(b.dataset.pledge)]; b.disabled = true; const m = $('pmsg'); m.innerHTML = `<div class="muted">signing the maturity transaction (lock time ${r.maturity}) and publishing…</div>`;
      try { const p = await w.pledge({ key, reward: r, relays }); if (!p.accepted) throw new Error('no relay accepted the pledge'); m.innerHTML = `<div class="good">pledged · the desk pays ${sats(p.pays)} sats once it has checked the pledge (about a minute)</div>`; setTimeout(async () => { await w.refresh(); render(); }, 45000); }
      catch (e) { m.innerHTML = `<div class="err">${esc(e.message)}</div>`; b.disabled = false; } });
  } catch (e) { el.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  const pp = $('ppaste'); if (pp) pp.onclick = async () => { const out = $('pout2'); try { const p = await w.publishPledge({ hex: $('phex').value, outpoint: $('pout').value.trim(), relays }); out.innerHTML = p.accepted ? `<div class="good">published · the desk checks it and pays the marker's script</div>` : `<div class="err">no relay accepted it</div>`; } catch (e) { out.innerHTML = `<div class="err">${esc(e.message)}</div>`; } };
}
// the preview: what will happen, from the signed transaction and the dry run, before anything is published.
// Resolves true on "send", false on "cancel". Every send path goes through it.
function preview(b, outId, { what, lines }) {
  return new Promise((resolve) => { const out = $(outId); const id = 'pv' + Math.random().toString(36).slice(2, 7);
    out.innerHTML = `<div class="note"><div style="font-weight:600;margin-bottom:.3rem">${esc(what)}</div><table style="margin:0">${lines.filter(Boolean).map(([k, v, cls]) => `<tr><td class="dim" style="padding:.1rem .8rem .1rem 0;white-space:nowrap">${esc(k)}</td><td class="${cls ?? ''}" style="padding:.1rem 0">${v}</td></tr>`).join('')}</table>
      <div class="row" style="margin-top:.6rem"><button class="ac" id="${id}-go">send</button><button id="${id}-no">cancel</button><span class="muted">signed on this device · checked against the chain this page validated · nothing has left yet</span></div></div>`;
    $(`${id}-go`).onclick = () => resolve(true); $(`${id}-no`).onclick = () => { out.innerHTML = '<div class="muted">cancelled; nothing was sent</div>'; resolve(false); }; });
}
const satsLines = (b, to) => [['to', `<span class="mono">${esc(to)}</span>`], ['they receive', `${sats(b.amount)} sats`], ['fee', `${sats(b.fee)} sats · ${b.vsize} vB at ${w.minFeeRate} sat/vB`], ['you keep', `${sats(w.balance(me.script).spendable - b.amount - b.fee)} sats spendable`], ['inputs', `${b.inputs.length} coin${b.inputs.length === 1 ? '' : 's'}, change ${sats(b.change)}`], ['arrives', `next block`], b.note ? ['note', esc(b.note), 'warn'] : null];
// the EVM activity of my address as this page has validated it
function renderActivity(addr) {
  const el = $('evact'); if (!el) return; const list = w.evmActivity(addr);
  if (!list.length) return (el.innerHTML = `<span class="muted">nothing yet for ${esc(addr.slice(0, 10))}…</span>`);
  el.innerHTML = `<table><tr><th>tx</th><th></th><th>status</th><th>block</th><th class="r">gas</th></tr>${list.map((r) => { const mine = r.from.toLowerCase() === addr.toLowerCase(); const what = r.contractAddress ? `deployed <span class="mono">${esc(r.contractAddress.slice(0, 10))}…</span>` : r.to?.toLowerCase() === '0x00000000000000000000000000000000000501de' ? 'withdrawal' : mine ? `to <span class="mono">${esc((r.to ?? '').slice(0, 10))}…</span>` : `from <span class="mono">${esc(r.from.slice(0, 10))}…</span>`;
    return `<tr><td class="mono"><a href="${explore('tx', r.sidechainTxid)}" target="_blank" rel="noopener" title="the sidestr transaction that carried it">${esc(r.transactionHash.slice(0, 12))}…</a></td><td>${what}</td><td>${r.status === 1 ? '<span class="good">ok</span>' : '<span class="bad">reverted</span>'}</td><td class="mono">${r.height}</td><td class="r mono">${Number(r.gasUsed).toLocaleString('en-US')}</td></tr>`; }).join('')}</table>`;
}
// an EVM action: build (signed here, dry-run on the page's state), publish the carrier, wait for the block, show the receipt
async function actEvm(builder, outId) {
  const out = $(outId); out.innerHTML = '<div class="muted">signing and dry-running on this page\'s state…</div>'; busy = true; let b;
  try { b = await builder(); if (!w.verify(b, key)) throw new Error('the sidestr signature did not verify; nothing was sent'); } catch (e) { busy = false; return out.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  const gw = (x) => `${Number(x).toLocaleString('en-US')} gwei`;
  const ok = await preview(b, outId, { what: b.note, lines: [['from', `<span class="mono">${esc(b.from)}</span>`], b.to ? ['to', `<span class="mono">${esc(b.to)}</span>`] : ['creates', `<span class="mono">${esc(b.contractAddress)}</span>`], b.value ? ['value', gw(b.value)] : null, ['gas', `${gw(b.gasUsed)} used in the dry run · limit ${Number(b.gasLimit).toLocaleString('en-US')} · 1 gwei per gas`], ['EVM balance after', `${gw(b.evmAfter / 1000000000n)} (from ${gw(b.evmBefore / 1000000000n)})`], b.withdrawal ? ['coinbase pays you', `${sats(b.withdrawal.sats)} sats in the same block`, 'good'] : null, ['sidestr fee', `${sats(b.fee)} sats from your coins`], ['nonce', String(b.nonce)]] });
  if (!ok) { busy = false; return; }
  out.innerHTML = `<div class="muted">Ethereum tx <code>${esc(b.ethHash.slice(0, 18))}…</code> in sidestr tx <code>${esc(b.txid.slice(0, 16))}…</code> · publishing…</div>`;
  try { const r = await w.publish(b.hex, relays); if (!r.accepted) throw new Error('no relay accepted the event'); out.innerHTML += `<div class="muted" id="wait3">waiting for the block…</div>`;
    for (let i = 0; i < 36; i++) { await new Promise((res) => setTimeout(res, 5000)); const m = await w.mined(b.txid); if (m) { const rc = w.evmReceipt(b.ethHash); busy = false; render(); const o = $(outId); if (o) o.innerHTML = `<div class="${rc?.status === 1 ? 'good' : 'err'}">${rc ? (rc.status === 1 ? 'done' : 'mined but reverted') : 'mined'} in block ${m.height}${rc ? ` · ${Number(rc.gasUsed).toLocaleString('en-US')} gas` : ''}${rc?.contractAddress ? ` · contract <code>${esc(rc.contractAddress)}</code>` : ''} · <a href="${explore('tx', b.txid)}" target="_blank" rel="noopener">explorer ↗</a></div>`; return; } const wt = $('wait3'); if (wt) wt.textContent = `waiting for the block… ${(i + 1) * 5} s`; }
    out.innerHTML += `<div class="warn">not on the mirror after 3 minutes; refresh later.</div>`;
  } catch (e) { out.innerHTML += `<div class="err">${esc(e.message)}</div>`; } busy = false;
}
// a build + publish + wait, shared by the send form and the deposit button
async function actSend(opts, outId, what) {
  const out = $(outId); out.innerHTML = ''; busy = true; let b;
  try { b = w.build(opts); if (!w.verify(b, key)) throw new Error('the signature did not verify; nothing was sent'); } catch (e) { busy = false; return out.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  const ok = await preview(b, outId, { what: b.note ?? what, lines: opts.evmDeposit ? [['deposit', `${sats(b.amount)} sats → ${sats(b.amount)} gwei`], ['credited to', `<span class="mono">${esc(opts.to)}</span>`], ['fee', `${sats(b.fee)} sats`], ['you keep', `${sats(w.balance(me.script).spendable - b.amount - b.fee)} sats spendable`]] : satsLines(b, opts.to) });
  if (!ok) { busy = false; return; }
  out.innerHTML = `<div class="muted">signed ${esc(b.txid.slice(0, 16))}… · publishing…</div>`;
  try { const r = await w.publish(b.hex, relays); if (!r.accepted) throw new Error('no relay accepted the event'); out.innerHTML += `<div class="muted" id="wait2">waiting for the mirror…</div>`;
    for (let i = 0; i < 36; i++) { await new Promise((res) => setTimeout(res, 5000)); const m = await w.mined(b.txid); if (m) { busy = false; render(); const o = $(outId); if (o) o.innerHTML = `<div class="good">${esc(what)} mined in block ${m.height} · <a href="${explore('tx', b.txid)}" target="_blank" rel="noopener">explorer ↗</a></div>`; return; } const wt = $('wait2'); if (wt) wt.textContent = `waiting for the mirror… ${(i + 1) * 5} s`; }
    out.innerHTML += `<div class="warn">not on the mirror after 3 minutes; refresh later.</div>`;
  } catch (e) { out.innerHTML += `<div class="err">${esc(e.message)}</div>`; } busy = false;
}
async function send() {
  const out = $('sendout'), btn = $('send'); out.innerHTML = ''; busy = true;
  let b; try { b = w.build({ key, to: $('to').value, amount: Number($('amount').value), fee: $('fee').value.trim() || null, pegout: $('pegout').checked }); if (!w.verify(b, key)) throw new Error('the signature did not verify; nothing was sent'); }
  catch (e) { return out.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  btn.disabled = true;
  const ok = await preview(b, 'sendout', { what: $('pegout').checked ? `peg out ${sats(b.amount)} sats to ${$('to').value.trim()} on ${w.chain.parent}` : `send ${sats(b.amount)} sats`, lines: $('pegout').checked ? [['burns here', `${sats(b.amount)} sats`], ['owed to you on the parent', `<span class="mono">${esc($('to').value.trim())}</span> · the peg holders pay it, usually within the hour`], ['fee', `${sats(b.fee)} sats`], ['you keep', `${sats(w.balance(me.script).spendable - b.amount - b.fee)} sats spendable`], b.note ? ['note', esc(b.note), 'warn'] : null] : satsLines(b, $('to').value.trim()) });
  if (!ok) { btn.disabled = false; busy = false; return; }
  out.innerHTML = `<div class="muted">signed <code>${esc(b.txid.slice(0, 16))}…</code> · publishing…</div>`;
  try {
    const r = await w.publish(b.hex, relays);
    const rl = Object.entries(r.results).map(([u, s]) => `<span class="${s === 'ok' ? 'good' : 'dim'}">${esc(u.replace('wss://', ''))}: ${esc(s)}</span>`).join(' · ');
    if (!r.accepted) { btn.disabled = false; busy = false; return out.innerHTML += `<div class="err">no relay accepted the event: ${rl}</div>`; }
    out.innerHTML += `<div>event <code>${esc(r.event.slice(0, 16))}…</code> → ${rl}</div><div id="wait" class="muted">waiting for the mirror to show it…</div>`;
    for (let i = 0; i < 36; i++) { await new Promise((res) => setTimeout(res, 5000)); const m = await w.mined(b.txid); if (m) { $('wait').innerHTML = `<span class="good">mined in block ${m.height}</span> · <a href="${explore('tx', b.txid)}" target="_blank" rel="noopener">on the explorer ↗</a>`; btn.disabled = false; busy = false; return render(); } $('wait').textContent = `waiting for the mirror to show it… ${(i + 1) * 5} s`; }
    $('wait').innerHTML = `<span class="warn">not on the mirror after 3 minutes</span> — the producer may be slow, or the mirror behind; refresh later.`;
  } catch (e) { out.innerHTML += `<div class="err">${esc(e.message)}</div>`; }
  btn.disabled = false; busy = false;
}
$('refresh').onclick = async () => { if (!w) return; $('refresh').disabled = true; try { await w.refresh(); await reloadPegouts(); render(); } finally { $('refresh').disabled = false; } };
