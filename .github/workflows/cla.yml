# Contributor License Agreement check (contributor-assistant/github-action, the CLA Assistant as a repo action):
# a pull request from someone who has not signed gets a comment asking them to; the reply
# "I have read the CLA Document and I hereby sign the CLA" records the signature in signatures/cla.json.
name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/gh-pages/CLA.md
          branch: gh-pages
          allowlist: melvincarvalho,dependabot[bot]
          custom-notsigned-prcomment: 'Thank you for the pull request. sidestr asks every contributor to sign its [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/gh-pages/CLA.md) once; it keeps the project free to stay AGPL and to be licensed on other terms too. To sign, reply with the sentence below.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
